# ============================================================================
# yazi.toml - yaziメイン設定
# ============================================================================

[mgr]
# 隠しファイルを表示
show_hidden = true

# ソート設定
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
sort_sensitive = false

# レイアウト
ratio = [1, 3, 4]
linemode = "size"

[preview]
# プレビュー設定
max_width = 1000
max_height = 1000
cache_dir = ""

# 画像プレビュー
image_quality = 75

[opener]
# エディタ（neovim）
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]

# ファイルを開く
open = [
  { run = 'open "$@"', desc = "Open with default app", for = "macos" },
]

# フォルダを開く
reveal = [
  { run = 'open -R "$@"', desc = "Reveal in Finder", for = "macos" },
]

[open]
rules = [
  # テキストファイル
  { url = "*.md", use = "edit" },
  { url = "*.txt", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.zsh", use = "edit" },
  { url = "*.py", use = "edit" },
  { url = "*.go", use = "edit" },
  { url = "*.rs", use = "edit" },
  { url = "*.js", use = "edit" },
  { url = "*.ts", use = "edit" },
  { url = "*.tsx", use = "edit" },
  { url = "*.jsx", use = "edit" },
  { url = "*.html", use = "edit" },
  { url = "*.css", use = "edit" },
  { url = "*.vim", use = "edit" },

  # MIME タイプ
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },

  # フォールバック
  { url = "*", use = "open" },
]

[tasks]
# 並列タスク数
micro_workers = 10
macro_workers = 25
bizarre_retry = 5

[plugin]
# プラグインプリロード
preloaders = [
  { url = "*", cond = "!mime", run = "mime", multi = true, prio = "high" },
]
